services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtg_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mtg_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    shm_size: "2gb"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mtg_inventory
      UPLOAD_DIR: /app/uploads
      PYTHON_BIN: python3
      SCAN_SCRIPT_PATH: /app/scan.py
      OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
      PADDLE_USE_GPU: ${PADDLE_USE_GPU:-false}
      PADDLE_DEVICE: ${PADDLE_DEVICE:-cpu}
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-en}
      PADDLE_USE_ANGLE_CLS: ${PADDLE_USE_ANGLE_CLS:-true}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY:-}
      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - mtgscan-cache:/app/.cache
      - paddle-cache:/root/.paddleocr
      - paddlex-cache:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres-data:
  uploads:
  mtgscan-cache:
  paddle-cache:
  paddlex-cache:
