services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server.gpu
    environment:
      PADDLE_USE_GPU: "true"
      PADDLE_DEVICE: gpu:0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
